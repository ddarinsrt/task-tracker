<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบติดตามงาน กคน.</title>
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>body { font-family: 'Sarabun', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800">

    <nav class="bg-blue-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <span class="font-bold text-lg">ระบบติดตามงาน กคน.</span>
            <div class="flex space-x-2">
                <button id="btn-dash" onclick="switchPage('dash')" class="px-3 py-1 bg-blue-700 rounded-md font-semibold text-sm">หัวหน้า</button>
                <button id="btn-admin" onclick="switchPage('admin')" class="px-3 py-1 hover:bg-blue-800 rounded-md text-sm text-gray-300">ธุรการ</button>
            </div>
        </div>
    </nav>

    <!-- หน้าจอ Dashboard หัวหน้า -->
    <main id="page-dash" class="max-w-md mx-auto px-4 py-6">
        <div class="grid grid-cols-3 gap-2 mb-6">
            <div class="bg-white p-3 rounded-xl shadow-sm text-center border-l-4 border-blue-500">
                <p class="text-xs text-gray-500">งานค้างทั้งหมด</p>
                <p id="count-all" class="text-xl font-bold text-blue-900">0</p>
            </div>
            <div class="bg-white p-3 rounded-xl shadow-sm text-center border-l-4 border-purple-500">
                <p class="text-xs text-gray-500">ค้าง ผคป.</p>
                <p id="count-pkp" class="text-xl font-bold text-purple-900">0</p>
            </div>
            <div class="bg-white p-3 rounded-xl shadow-sm text-center border-l-4 border-orange-500">
                <p class="text-xs text-gray-500">ค้าง ผคอ.</p>
                <p id="count-pko" class="text-xl font-bold text-orange-900">0</p>
            </div>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm mb-6 space-y-2">
            <label class="text-xs font-semibold text-gray-600 block">ตัวกรองแผนก</label>
            <select id="filter-dept" onchange="renderTasks()" class="w-full p-2 border rounded-lg text-sm bg-gray-50">
                <option value="all">ดูทั้งหมดทุกแผนก</option>
                <option value="ผคป.">เฉพาะแผนก ผคป.</option>
                <option value="ผคอ.">เฉพาะแผนก ผคอ.</option>
            </select>
        </div>

        <h2 class="font-bold text-gray-700 mb-3 text-base flex justify-between items-center">
            <span>รายการหนังสือราชการ</span>
            <button onclick="fetchData()" class="text-xs text-blue-600 font-normal">🔄 รีเฟรช</button>
        </h2>
        <div id="task-container" class="space-y-4">
            <p class="text-center text-gray-400 py-8 text-sm">กำลังโหลดข้อมูลงาน...</p>
        </div>
    </main>

    <!-- หน้าจอล็อกอินธุรการ -->
    <div id="page-login" class="max-w-md mx-auto px-4 py-12 hidden">
        <div class="bg-white p-6 rounded-2xl shadow-sm border text-center">
            <h2 class="font-bold text-lg mb-4 text-gray-700">🔒 เจ้าหน้าที่ธุรการ</h2>
            <input type="password" id="input-pass" placeholder="กรอกรหัสผ่าน" class="w-full p-3 border rounded-xl text-center mb-4 bg-gray-50">
            <button onclick="checkPassword()" class="w-full bg-blue-900 text-white p-3 rounded-xl font-bold shadow-sm hover:bg-blue-800">เข้าสู่ระบบ</button>
        </div>
    </div>

    <!-- ฟอร์มธุรการ -->
    <main id="page-admin" class="max-w-md mx-auto px-4 py-6 hidden">
        <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-4">
            <h2 class="font-bold text-lg text-gray-700 border-b pb-2 flex justify-between items-center">
                <span id="form-title">📝 บันทึกงานใหม่</span>
                <button onclick="cancelEdit()" class="text-xs text-red-500 font-normal">ยกเลิก/กลับ</button>
            </h2>
            
            <input type="hidden" id="form-id">
            
            <!-- ส่วนที่ 1: ข้อมูลหนังสือรับเข้า (B-C) -->
            <div class="grid grid-cols-2 gap-2 bg-blue-50 p-3 rounded-xl border border-blue-100">
                <div>
                    <label class="text-[11px] font-bold text-blue-900 block mb-1">วันที่รับเข้า</label>
                    <input type="date" id="form-inDate" class="w-full p-2 border rounded-lg text-sm bg-white">
                </div>
                <div>
                    <label class="text-[11px] font-bold text-blue-900 block mb-1">เลขหนังสือรับเข้า</label>
                    <input type="text" id="form-inNo" placeholder="เลขรับ..." class="w-full p-2 border rounded-lg text-sm bg-white">
                </div>
            </div>

            <!-- ส่วนที่ 2: ข้อมูลงานและคำสั่งการ (D-H) -->
            <div>
                <label class="text-xs font-semibold text-gray-600 block mb-1">เรื่อง/ชื่อเอกสาร</label>
                <input type="text" id="form-docName" placeholder="เรื่องเอกสาร..." class="w-full p-2.5 border rounded-lg text-sm bg-gray-50">
            </div>
            <div>
                <label class="text-xs font-semibold text-gray-600 block mb-1">รายละเอียดการสั่งการท้ายคำสั่ง</label>
                <textarea id="form-details" rows="3" placeholder="ระบุคำสั่งการ..." class="w-full p-2.5 border rounded-lg text-sm bg-gray-50"></textarea>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-xs font-semibold text-gray-600 block mb-1">วันที่สั่งการ</label>
                    <input type="date" id="form-dateOrdered" class="w-full p-2.5 border rounded-lg text-sm bg-gray-50">
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-600 block mb-1">แผนกที่รับผิดชอบ</label>
                    <select id="form-department" class="w-full p-2.5 border rounded-lg text-sm bg-gray-50">
                        <option value="ผคป.">ผคป.</option>
                        <option value="ผคอ.">ผคอ.</option>
                    </select>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-xs font-semibold text-gray-600 block mb-1">ชั้นความเร็ว</label>
                    <select id="form-priority" class="w-full p-2.5 border rounded-lg text-sm bg-gray-50">
                        <option value="ปกติ">ปกติ</option>
                        <option value="ด่วน">ด่วน</option>
                        <option value="ด่วนมาก">ด่วนมาก</option>
                        <option value="ด่วนที่สุด">ด่วนที่สุด</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-600 block mb-1">สถานะ</label>
                    <select id="form-status" class="w-full p-2.5 border rounded-lg text-sm bg-gray-50">
                        <option value="ยังไม่ทำ">ยังไม่ทำ</option>
                        <option value="กำลังทำ">กำลังทำ</option>
                        <option value="เสร็จสิ้น">เสร็จสิ้น</option>
                    </select>
                </div>
            </div>

            <!-- ส่วนที่ 3: ข้อมูลหนังสือออก (J-K) -->
            <div class="grid grid-cols-2 gap-2 bg-purple-50 p-3 rounded-xl border border-purple-100">
                <div>
                    <label class="text-[11px] font-bold text-purple-900 block mb-1">เลขหนังสือออก</label>
                    <input type="text" id="form-outNo" placeholder="เลขส่ง..." class="w-full p-2 border rounded-lg text-sm bg-white">
                </div>
                <div>
                    <label class="text-[11px] font-bold text-purple-900 block mb-1">วันที่ออกหนังสือ/เสร็จสิ้น</label>
                    <input type="date" id="form-deadline" class="w-full p-2 border rounded-lg text-sm bg-white">
                </div>
            </div>
            
            <button onclick="submitForm()" id="btn-submit" class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold shadow-md hover:bg-blue-700">📌 บันทึกข้อมูลงาน</button>
            <button onclick="deleteTask()" id="btn-delete" class="w-full bg-red-600 text-white p-2 rounded-xl font-semibold shadow-sm hover:bg-red-700 hidden">🗑| ลบงานนี้ถาวร</button>
        </div>
    </main>

    <script>
        // ⚠️ ลบตัวหนังสือไทยออก แล้ววางลิงก์ Web App URL ตัวใหม่ล่าสุดของคุณที่นี่ครับ
        const API_URL = 'https://script.google.com/macros/s/AKfycbwc_72tl3YY42VMcr0gpjcn0kIEQEayv8rd7ppyUrFIzoK_soAQeDVY0QKrpwaJ52ye/exec';
        const ADMIN_PASSWORD = '1234';

        let allTasks = [];
        let isAdminAuthenticated = false;
        let isEditMode = false;

        function switchPage(page) {
            document.getElementById('page-dash').classList.add('hidden');
            document.getElementById('page-login').classList.add('hidden');
            document.getElementById('page-admin').classList.add('hidden');
            document.getElementById('btn-dash').className = "px-3 py-1 hover:bg-blue-800 rounded-md text-sm text-gray-300";
            document.getElementById('btn-admin').className = "px-3 py-1 hover:bg-blue-800 rounded-md text-sm text-gray-300";

            if (page === 'dash') {
                document.getElementById('page-dash').classList.remove('hidden');
                document.getElementById('btn-dash').className = "px-3 py-1 bg-blue-700 rounded-md font-semibold text-sm";
                fetchData();
            } else if (page === 'admin') {
                if (isAdminAuthenticated) {
                    document.getElementById('page-admin').classList.remove('hidden');
                    document.getElementById('btn-admin').className = "px-3 py-1 bg-blue-700 rounded-md font-semibold text-sm";
                } else {
                    document.getElementById('page-login').classList.remove('hidden');
                }
            }
        }
