<body class="font-sans text-ink antialiased">

<header class="sticky top-0 z-20 bg-ink text-white" style="padding-top: env(safe-area-inset-top, 0px)">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-4 pb-2 pt-3">

<div id="toast" role="status" class="hidden"></div>

<script>
/* =====================================================
   ตั้งค่า
   - API_URL: URL ของ Web App (Google Apps Script) ที่ลงท้ายด้วย /exec
   - ADMIN_PASSWORD: รหัสผ่านหน้าธุรการ (ต้องตรงกับ PASSWORD ใน Code.gs)
   ===================================================== */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbzOS0wk5M3AWzxTq3glLFVQ3s02BgtLiu5x5zbv4x-6QjgFa8oF00npy6jjY8ovTeyg/exec',
  ADMIN_PASSWORD: '1234',
};

const DEPTS = ['ผคป.', 'ผคอ.'];
const LATE_DAYS = 7;   // ค้างเกินกี่วันถึงขึ้นตัวหนังสือสีแดง

const URGENCY = {
  'ด่วนที่สุด': { rank: 0, cls: 'bg-red-600 text-white' },
  'ด่วนมาก':   { rank: 1, cls: 'bg-orange-500 text-white' },
  'ด่วน':      { rank: 2, cls: 'bg-amber-100 text-amber-800' },
  'ปกติ':      { rank: 3, cls: 'bg-slate-100 text-slate-600' },
};

const STATUS = {
  'ยังไม่ทำ':  { bar: 'bg-red-500',     pill: 'bg-red-50 text-red-700',         dot: 'bg-red-500' },
  'กำลังทำ':   { bar: 'bg-amber-400',   pill: 'bg-amber-50 text-amber-800',     dot: 'bg-amber-400' },
  'เสร็จสิ้น': { bar: 'bg-emerald-500', pill: 'bg-emerald-50 text-emerald-700', dot: 'bg-emerald-500' },
};
const LEGACY_STATUS = { 'ยังไม่เสร็จ': 'ยังไม่ทำ', 'กำลังดำเนินการ': 'กำลังทำ' };

const STATUS_TABS = [
  { key: 'open', label: 'ค้างทั้งหมด' },
  { key: 'ยังไม่ทำ', label: 'ยังไม่ทำ' },
  { key: 'กำลังทำ', label: 'กำลังทำ' },
  { key: 'เสร็จสิ้น', label: 'เสร็จสิ้น' },
  { key: 'all', label: 'ทั้งหมด' },
];

const state = { tasks: [], dept: 'all', status: 'open', view: 'dash', unlocked: false, editing: null, deleting: null, q: '' };

/* ---------- ตัวช่วย ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const isOpen = t => t.status !== 'เสร็จสิ้น';
const pad = n => String(n).padStart(2, '0');
const fmtInput = d => d ? `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}` : '';
const todayStr = () => fmtInput(new Date());
const fmtDate = d => d ? d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' }) : '';
const startDate = t => t.recvDate || t.orderDate;
const ageDays = t => { const s = startDate(t); if (!s) return null; const n = new Date(); n.setHours(0, 0, 0, 0); return Math.max(0, Math.round((n - s) / 864e5)); };
const normDept = v => {
  const t = String(v || '').replace(/\s/g, ''), key = x => x.replace(/\./g, '');
  return DEPTS.find(d => key(d) === key(t)) || t || 'ไม่ระบุแผนก';
};
const normStatus = v => { const t = String(v || '').trim(); return STATUS[t] ? t : (LEGACY_STATUS[t] || 'ยังไม่ทำ'); };

function parseDate(v) {
  if (!v) return null;
  const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) { const d = new Date(v); return isNaN(d) ? null : d; }
  let y = +m[1];
  if (y > 2400) y -= 543;
  return new Date(y, +m[2] - 1, +m[3]);
}

function toast(text, ok = true) {
  const el = $('toast');
  el.textContent = text;
  el.className = 'fixed left-1/2 z-50 -translate-x-1/2 rounded-full px-5 py-3 text-sm font-medium shadow-lg ' + (ok ? 'bg-emerald-600 text-white' : 'bg-red-600 text-white');
  el.style.bottom = 'calc(1.5rem + env(safe-area-inset-bottom, 0px))';
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.add('hidden'), 3500);
}

/* ---------- เชื่อม Google Sheets ---------- */
async function fetchTasks() {
  const res = await fetch(CONFIG.API_URL);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'ข้อมูลไม่ถูกต้อง');
  return json.tasks.map(r => ({
    id: r.id || '',
    recvDate: parseDate(r.receivedDate),
    recvNo: String(r.receivedNo || '').trim(),
    title: String(r.title || '').trim(),
    note: String(r.note || '').trim(),
    orderDate: parseDate(r.orderDate),
    dept: normDept(r.dept),
    urgency: URGENCY[r.urgency] ? r.urgency : 'ปกติ',
    status: normStatus(r.status),
    outNo: String(r.outNo || '').trim(),
    doneDate: parseDate(r.doneDate),
  })).filter(t => t.title).map((t, i) => ({ ...t, i }));
}

// action = 'add' | 'update' | 'delete'
async function postAction(action, data) {
  // ใช้ text/plain เพื่อไม่ให้เบราว์เซอร์ส่ง preflight (Apps Script ไม่รองรับ OPTIONS)
  const res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ ...data, action, password: CONFIG.ADMIN_PASSWORD }),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'ดำเนินการไม่สำเร็จ');
  return json;
}

/* ---------- Dashboard ---------- */
const urgentCount = list => list.filter(t => URGENCY[t.urgency].rank <= 1).length;

function renderKpi() {
  const open = state.tasks.filter(isOpen);
  const card = (key, label, list, dark) => {
    const on = state.dept === key;
    const n = urgentCount(list);
    const style = dark || on ? 'bg-ink text-white ring-ink' : 'bg-white ring-slate-200 active:bg-slate-50';
    const sub = dark || on ? 'text-slate-300' : 'text-slate-500';
    return `<button data-dept="${esc(key)}" class="rounded-2xl p-4 text-left ring-1 ${style} ${dark ? 'col-span-2 md:col-span-1' : ''}">
      <span class="block text-sm ${sub}">${label}</span>
      <span class="mt-1 block text-5xl font-bold leading-none tabular-nums">${list.length}</span>
      <span class="mt-3 block text-xs ${sub}">${n ? `ด่วนมากขึ้นไป ${n} เรื่อง` : 'ไม่มีงานด่วนมาก'}</span>
    </button>`;
  };
  $('kpi').innerHTML =
    card('all', 'งานคงค้างทั้งหมด', open, true) +
    DEPTS.map(d => card(d, 'งานค้าง ' + d, open.filter(t => t.dept === d), false)).join('');
}

function renderFilters() {
  $('deptTabs').innerHTML = [['all', 'ทั้งหมด'], ...DEPTS.map(d => [d, d])].map(([k, l]) => {
    const on = state.dept === k;
    return `<button data-dept="${esc(k)}" aria-pressed="${on}" class="h-11 rounded-lg text-sm font-semibold ring-1 ${on ? 'bg-ink text-white ring-ink' : 'bg-white text-slate-700 ring-slate-300 active:bg-slate-50'}">${l}</button>`;
  }).join('');
  $('statusTabs').innerHTML = STATUS_TABS.map(t => {
    const on = state.status === t.key;
    const dot = STATUS[t.key] ? `<span class="h-2 w-2 rounded-full ${STATUS[t.key].dot}"></span>` : '';
    return `<button data-status="${esc(t.key)}" aria-pressed="${on}" class="flex h-11 shrink-0 items-center gap-2 rounded-full px-4 text-sm font-medium ring-1 ${on ? 'bg-ink text-white ring-ink' : 'bg-white text-slate-700 ring-slate-300 active:bg-slate-50'}">${dot}${t.label}</button>`;
  }).join('');
}

function filtered() {
  const far = 8.64e15;
  return state.tasks
    .filter(t => state.dept === 'all' || t.dept === state.dept)
    .filter(t => state.status === 'all' ? true : state.status === 'open' ? isOpen(t) : t.status === state.status)
    .sort((a, b) => URGENCY[a.urgency].rank - URGENCY[b.urgency].rank
      || (startDate(a) ? +startDate(a) : far) - (startDate(b) ? +startDate(b) : far)
      || a.i - b.i);
}

function taskCard(t) {
  const s = STATUS[t.status];
  const age = ageDays(t);
  const open = isOpen(t);
  const outLine = t.outNo
    ? `<p class="mt-2 text-sm text-slate-600">หนังสือออก เลขที่ <span class="font-medium text-slate-800">${esc(t.outNo)}</span>${t.doneDate ? ' ลงวันที่ ' + fmtDate(t.doneDate) : ''}</p>` : '';
  let right = '';
  if (open && age !== null) right = `<span class="text-xs ${age >= LATE_DAYS ? 'font-semibold text-red-600' : 'text-slate-400'}">ค้างมา ${age} วัน</span>`;
  else if (!open && t.doneDate && !t.outNo) right = `<span class="text-xs text-slate-500">เสร็จสิ้น ${fmtDate(t.doneDate)}</span>`;
  return `<article class="relative overflow-hidden rounded-xl bg-white ring-1 ring-slate-200 ${open ? '' : 'opacity-75'}">
    <span class="absolute inset-y-0 left-0 w-1.5 ${s.bar}"></span>
    <div class="py-4 pl-5 pr-4">
      <div class="flex items-start justify-between gap-3">
        <h3 class="text-base font-semibold leading-snug">${esc(t.title)}</h3>
        <span class="shrink-0 rounded-full px-2.5 py-1 text-xs font-medium ${URGENCY[t.urgency].cls}">${esc(t.urgency)}</span>
      </div>
      <div class="mt-1.5 flex flex-wrap items-center gap-x-3 gap-y-1 text-sm text-slate-500">
        <span class="font-medium text-slate-700">${esc(t.dept)}</span>
        ${t.recvDate ? `<span>รับเข้า ${fmtDate(t.recvDate)}</span>` : ''}
        ${t.recvNo ? `<span>เลขรับ ${esc(t.recvNo)}</span>` : ''}
        ${t.orderDate ? `<span>สั่งการ ${fmtDate(t.orderDate)}</span>` : ''}
      </div>
      <div class="mt-3 rounded-lg bg-slate-50 px-3 py-2.5">
        <p class="text-xs font-medium text-slate-500">คำสั่งการท้ายหนังสือ</p>
        <p class="mt-0.5 whitespace-pre-line text-sm leading-relaxed text-slate-800">${esc(t.note) || '–'}</p>
      </div>
      ${outLine}
      <div class="mt-3 flex items-center justify-between gap-2">
        <span class="rounded-full px-2.5 py-1 text-xs font-medium ${s.pill}">${esc(t.status)}</span>
        ${right}
      </div>
    </div>
  </article>`;
}

function renderList() {
  const list = filtered();
  $('resultInfo').textContent = `แสดง ${list.length} รายการ` + (state.dept !== 'all' ? ` ของ ${state.dept}` : '') + ' เรียงตามความเร่งด่วน แล้วตามวันที่รับเข้า (เก่าสุดก่อน)';
  $('taskList').innerHTML = list.length
    ? list.map(taskCard).join('')
    : `<div class="col-span-full rounded-xl bg-white p-8 text-center ring-1 ring-slate-200">
         <p class="font-medium">ไม่มีงานตามตัวกรองนี้</p>
         <p class="mt-1 text-sm text-slate-500">ลองเปลี่ยนแผนกหรือสถานะที่เลือก</p>
         <button data-reset class="mt-4 h-11 rounded-full bg-ink px-5 text-sm font-medium text-white">ล้างตัวกรอง</button>
       </div>`;
}

/* ---------- หน้าธุรการ: รายการสำหรับแก้ไข/ลบ ---------- */
function renderAdminList() {
  if (!state.unlocked) return;
  const q = state.q.trim().toLowerCase();
  const all = state.tasks
    .filter(t => !q || [t.title, t.recvNo, t.outNo, t.dept].some(x => String(x).toLowerCase().includes(q)))
    .sort((a, b) => (+(startDate(b) || 0)) - (+(startDate(a) || 0)) || b.i - a.i);
  const LIMIT = 100;
  const list = all.slice(0, LIMIT);
  $('adminCount').textContent = all.length
    ? `ทั้งหมด ${all.length} รายการ` + (all.length > LIMIT ? ` (แสดง ${LIMIT} รายการล่าสุด พิมพ์ค้นหาเพื่อดูรายการอื่น)` : '')
    : (state.tasks.length ? 'ไม่พบรายการที่ค้นหา' : 'ยังไม่มีข้อมูล');
  $('adminList').innerHTML = list.map(t => {
    const s = STATUS[t.status];
    return `<div class="rounded-xl bg-white p-3 ring-1 ring-slate-200">
      <div class="flex items-start gap-3">
        <span class="mt-2 h-2.5 w-2.5 shrink-0 rounded-full ${s.dot}"></span>
        <div class="min-w-0 flex-1">
          <p class="font-medium leading-snug">${esc(t.title)}</p>
          <p class="mt-1 text-xs text-slate-500">${esc(t.dept)}${t.recvDate ? ' รับเข้า ' + fmtDate(t.recvDate) : ''}${t.recvNo ? ' เลขรับ ' + esc(t.recvNo) : ''}</p>
        </div>
        <span class="shrink-0 rounded-full px-2.5 py-1 text-xs font-medium ${s.pill}">${esc(t.status)}</span>
      </div>
      <div class="mt-3 grid grid-cols-2 gap-2">
        <button data-edit="${esc(t.id)}" class="h-11 rounded-lg text-sm font-semibold text-slate-700 ring-1 ring-slate-300 active:bg-slate-50">แก้ไข</button>
        <button data-del="${esc(t.id)}" class="h-11 rounded-lg text-sm font-semibold text-red-700 ring-1 ring-red-200 active:bg-red-50">ลบ</button>
      </div>
    </div>`;
  }).join('');
}

function renderAll() { renderFilters(); renderKpi(); renderList(); renderAdminList(); }

/* ---------- สลับหน้า ---------- */
function setView(v) {
  state.view = v;
  $('viewDash').classList.toggle('hidden', v !== 'dash');
  $('viewAdmin').classList.toggle('hidden', v !== 'admin');
  document.querySelectorAll('[data-view]').forEach(b => {
    const on = b.dataset.view === v;
    b.setAttribute('aria-selected', on);
    b.className = 'h-12 border-b-4 px-4 text-sm font-semibold ' + (on ? 'border-white text-white' : 'border-transparent text-slate-300');
  });
  $('adminGate').classList.toggle('hidden', state.unlocked);
  $('adminPanel').classList.toggle('hidden', !state.unlocked);
  if (v === 'admin' && !state.unlocked) setTimeout(() => $('pw').focus(), 50);
  if (v === 'admin') renderAdminList();
  window.scrollTo({ top: 0 });
}

$('gateForm').addEventListener('submit', e => {
  e.preventDefault();
  if ($('pw').value === CONFIG.ADMIN_PASSWORD) {
    state.unlocked = true;
    $('gateMsg').classList.add('hidden');
    $('pw').value = '';
    setView('admin');
  } else {
    $('gateMsg').textContent = 'รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่';
    $('gateMsg').classList.remove('hidden');
    $('pw').value = '';
    $('pw').focus();
  }
});
$('logout').addEventListener('click', () => { state.unlocked = false; closeForm(); closeDel(); setView('dash'); });
$('adminSearch').addEventListener('input', e => { state.q = e.target.value; renderAdminList(); });

/* ---------- ฟอร์มเพิ่ม / แก้ไข ---------- */
const val = id => $(id).value;

function showFormMsg(text, ok) {
  const el = $('formMsg');
  el.textContent = text;
  el.className = 'rounded-lg px-3 py-2.5 text-sm font-medium ' + (ok ? 'bg-emerald-50 text-emerald-800' : 'bg-red-50 text-red-700');
}

function openForm(task) {
  state.editing = task || null;
  $('taskForm').reset();
  $('formMsg').className = 'hidden';
  $('formTitle').textContent = task ? 'แก้ไขข้อมูลงาน' : 'เพิ่มงานใหม่';
  $('saveBtn').textContent = task ? 'บันทึกการแก้ไข' : 'บันทึกข้อมูลงาน';
  if (task) {
    $('f_recvDate').value = fmtInput(task.recvDate);
    $('f_recvNo').value = task.recvNo;
    $('f_title').value = task.title;
    $('f_note').value = task.note;
    $('f_orderDate').value = fmtInput(task.orderDate);
    $('f_dept').value = task.dept;
    $('f_urgency').value = task.urgency;
    $('f_status').value = task.status;
    $('f_outNo').value = task.outNo;
    $('f_doneDate').value = fmtInput(task.doneDate);
  } else {
    $('f_recvDate').value = todayStr();
  }
  $('formModal').classList.remove('hidden');
  document.body.classList.add('overflow-hidden');
}

function closeForm() {
  $('formModal').classList.add('hidden');
  if ($('delModal').classList.contains('hidden')) document.body.classList.remove('overflow-hidden');
  state.editing = null;
}

// เลือก "เสร็จสิ้น" แล้วช่องวันที่ยังว่าง ให้ใส่วันนี้ให้ (แก้ไขได้)
$('f_status').addEventListener('change', () => {
  if (val('f_status') === 'เสร็จสิ้น' && !val('f_doneDate')) $('f_doneDate').value = todayStr();
});

$('addBtn').addEventListener('click', () => openForm(null));
$('closeForm').addEventListener('click', closeForm);
$('cancelForm').addEventListener('click', closeForm);

$('taskForm').addEventListener('submit', async e => {
  e.preventDefault();
  const payload = {
    receivedDate: val('f_recvDate'),
    receivedNo: val('f_recvNo').trim(),
    title: val('f_title').trim(),
    note: val('f_note').trim(),
    orderDate: val('f_orderDate'),
    dept: val('f_dept'),
    urgency: val('f_urgency'),
    status: val('f_status'),
    outNo: val('f_outNo').trim(),
    doneDate: val('f_doneDate'),
  };
  if (!payload.title) return showFormMsg('กรุณากรอกเรื่อง/ชื่อเอกสาร', false);
  if (payload.orderDate && payload.orderDate < payload.receivedDate) return showFormMsg('วันที่สั่งการต้องไม่ก่อนวันที่รับเข้า', false);
  if (payload.doneDate && payload.doneDate < payload.receivedDate) return showFormMsg('วันที่ออกหนังสือ/เสร็จสิ้นต้องไม่ก่อนวันที่รับเข้า', false);

  const editing = state.editing;
  if (editing) payload.id = editing.id;

  const btn = $('saveBtn'), label = btn.textContent;
  btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
  try {
    await postAction(editing ? 'update' : 'add', payload);
    closeForm();
    toast(editing ? 'แก้ไขข้อมูลเรียบร้อยแล้ว' : 'บันทึกข้อมูลงานเรียบร้อยแล้ว');
    load(true);
  } catch (err) {
    showFormMsg('บันทึกไม่สำเร็จ: ' + err.message, false);
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
});

/* ---------- ลบ ---------- */
function openDel(task) {
  state.deleting = task;
  $('delTitle').textContent = task.title;
  $('delMsg').classList.add('hidden');
  $('delModal').classList.remove('hidden');
  document.body.classList.add('overflow-hidden');
}
function closeDel() {
  $('delModal').classList.add('hidden');
  if ($('formModal').classList.contains('hidden')) document.body.classList.remove('overflow-hidden');
  state.deleting = null;
}
$('delCancel').addEventListener('click', closeDel);
$('delOk').addEventListener('click', async () => {
  const t = state.deleting;
  if (!t) return;
  const btn = $('delOk');
  btn.disabled = true; btn.textContent = 'กำลังลบ…';
  try {
    await postAction('delete', { id: t.id });
    closeDel();
    toast('ลบข้อมูลเรียบร้อยแล้ว');
    load(true);
  } catch (err) {
    $('delMsg').textContent = 'ลบไม่สำเร็จ: ' + err.message;
    $('delMsg').classList.remove('hidden');
  } finally {
    btn.disabled = false; btn.textContent = 'ลบข้อมูล';
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeForm(); closeDel(); }
});

/* ---------- เหตุการณ์ทั่วไป ---------- */
document.addEventListener('click', e => {
  const v = e.target.closest('[data-view]');
  const d = e.target.closest('[data-dept]');
  const s = e.target.closest('[data-status]');
  const ed = e.target.closest('[data-edit]');
  const dl = e.target.closest('[data-del]');
  if (v) setView(v.dataset.view);
  else if (d) { state.dept = d.dataset.dept; renderAll(); }
  else if (s) { state.status = s.dataset.status; renderAll(); }
  else if (ed) {
    const t = state.tasks.find(x => x.id === ed.dataset.edit);
    if (t && t.id) openForm(t); else toast('รายการนี้ยังไม่มีรหัส กรุณารีเฟรชแล้วลองใหม่', false);
  }
  else if (dl) {
    const t = state.tasks.find(x => x.id === dl.dataset.del);
    if (t && t.id) openDel(t); else toast('รายการนี้ยังไม่มีรหัส กรุณารีเฟรชแล้วลองใหม่', false);
  }
  else if (e.target.closest('[data-retry]')) load();
  else if (e.target.closest('[data-reset]')) { state.dept = 'all'; state.status = 'all'; renderAll(); }
});

async function load(quiet) {
  $('refreshIcon').classList.add('spin');
  if (!state.tasks.length && !quiet) $('taskList').innerHTML = '<p class="col-span-full py-10 text-center text-slate-500">กำลังโหลดข้อมูล…</p>';
  try {
    state.tasks = await fetchTasks();
    $('updated').textContent = 'อัปเดตล่าสุด ' + new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.';
    renderAll();
  } catch (err) {
    $('updated').textContent = 'โหลดข้อมูลไม่สำเร็จ';
    if (!state.tasks.length) {
      renderFilters(); renderKpi();
      $('resultInfo').textContent = '';
      $('taskList').innerHTML = `<div class="col-span-full rounded-xl bg-white p-8 text-center ring-1 ring-slate-200">
        <p class="font-medium">โหลดข้อมูลไม่สำเร็จ</p>
        <p class="mt-1 text-sm text-slate-500">${esc(err.message)}</p>
        <button data-retry class="mt-4 h-11 rounded-full bg-ink px-5 text-sm font-medium text-white">ลองใหม่</button>
      </div>`;
    }
  } finally {
    $('refreshIcon').classList.remove('spin');
  }
}
$('refresh').addEventListener('click', () => load());

setView('dash');
renderFilters();
load();
</script>
</body>
</html>
